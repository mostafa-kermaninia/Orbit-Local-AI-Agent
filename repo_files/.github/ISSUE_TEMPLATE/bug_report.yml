name: Bug report
description: Report a reproducible ORBIT problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, tokens, private messages, or personal audio.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice / microphone / Whisper
        - Ollama / local model
        - Telegram Desktop automation
        - Web research / browser
        - YouTube
        - TTS
        - Memory
        - UI / HUD
        - Setup / dependencies
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Say/type ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"

  - type: input
    id: model
    attributes:
      label: Ollama model
      placeholder: "qwen2.5:7b"

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private names/messages before pasting logs.
      render: shell
