[project]
name = "orbit-local-ai-agent"
version = "1.0.0"
description = "Local-first Windows voice agent with Whisper, Ollama/Qwen, tool calling, desktop automation, memory, TTS, and a real-time HUD."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Mostafa Kermaninia" }
]
keywords = [
  "voice-assistant",
  "speech-recognition",
  "local-ai",
  "ollama",
  "tool-calling",
  "desktop-automation"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Deliberately start with correctness-focused linting rather than style churn.
select = ["E9", "F63", "F7", "F82"]
