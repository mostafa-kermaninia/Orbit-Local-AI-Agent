version: 2

updates:
  # Python dependencies:
  # Disable routine version-update PRs for the stable course build.
  # Security update PRs can still be created when a vulnerability is found.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Same policy: no routine upgrade noise, keep security monitoring active.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0