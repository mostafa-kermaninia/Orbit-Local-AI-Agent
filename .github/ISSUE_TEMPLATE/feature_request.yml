name: Feature request
description: Suggest an improvement for ORBIT
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / teaching need
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible behavior.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice / audio
        - Local LLM
        - Tools
        - Telegram
        - Web research
        - YouTube
        - Memory
        - UI / HUD
        - Documentation / course
        - Other
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety / licensing
      options:
        - label: This request does not require copied proprietary/unknown-license code or assets.
          required: true
